<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Briefing</title>
  <meta http-equiv="refresh" content="0;url=latest.html">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f6f7f9; color: #1d2430; }
    p { font-size: 1.1rem; }
    a { color: #2457c5; }
  </style>
</head>
<body>
  <p>Loading latest briefing&hellip; <a href="latest.html">click here</a></p>
<script>
(function(){var h=document.documentElement,t=document.getElementById('theme-toggle'),s=localStorage.getItem('theme');if(s==='dark')h.setAttribute('data-theme','dark');if(t){t.textContent=h.getAttribute('data-theme')==='dark'?'🌙':'☀️';t.addEventListener('click',function(){var d=h.getAttribute('data-theme')==='dark';if(d){h.removeAttribute('data-theme');localStorage.setItem('theme','light');t.textContent='☀️'}else{h.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');t.textContent='🌙'}})})();
</script>
</body>
</html>
