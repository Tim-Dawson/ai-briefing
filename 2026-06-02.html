<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Briefing — June 2nd, 2026</title>
  <link rel="canonical" href="https://blog.prizeable.co.uk/2026-06-02.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
      --bg: #f8f9fb;
      --surface: #ffffff;
      --text: #1a1e26;
      --text-secondary: #5b6577;
      --text-tertiary: #9099a8;
      --border: #e2e6ed;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eef2ff;
      --accent-border: #bfd4ff;
      --highlight: #fef9e7;
      --highlight-border: #f5d742;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
      --radius: 10px;
      --radius-sm: 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --text: #e6edf3;
        --text-secondary: #8b949e;
        --text-tertiary: #6e7681;
        --border: #30363d;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
        --accent-soft: #0d1b2e;
        --accent-border: #1f3a5f;
        --highlight: #1a1508;
        --highlight-border: #5c4400;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-lg: 0 4px 16px rgba(0,0,0,0.3);
      }
    }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .site-header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .site-header-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-title a {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .site-title a:hover { color: var(--accent); }
    .site-nav a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      margin-left: 20px;
      transition: color 0.15s;
    }
    .site-nav a:hover { color: var(--accent); }
    article {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    .article-header {
      margin-bottom: 40px;
    }
    .article-header .eyebrow {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .article-header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .article-meta time { font-weight: 500; }
    .article-meta .reading-time::before {
      content: '·';
      margin-right: 16px;
      color: var(--text-tertiary);
    }
    .article-meta .reading-time { color: var(--text-tertiary); }
    .section {
      margin-bottom: 28px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s;
    }
    .section:hover {
      box-shadow: var(--shadow-lg);
    }
    .section h2 {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .section p {
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.75;
    }
    .section p:last-child { margin-bottom: 0; }
    .section ul {
      margin: 8px 0 0;
      padding-left: 1.25rem;
    }
    .section li {
      margin: 6px 0;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .section a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .section a:hover {
      border-bottom-color: var(--accent);
    }
    .section strong { font-weight: 600; color: var(--text); }
    .section code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      padding: 2px 6px;
      background: var(--accent-soft);
      border-radius: var(--radius-sm);
    }
    .section-highlight {
      border-left: 4px solid var(--highlight-border);
      background: var(--highlight);
    }
    .section-highlight h2 {
      color: var(--text);
    }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-right: 6px;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    .at-a-glance {
      margin-bottom: 28px;
      padding: 20px 24px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
    }
    .at-a-glance h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .at-a-glance ul {
      list-style: none;
      padding: 0;
    }
    .at-a-glance li {
      position: relative;
      padding-left: 20px;
      margin: 8px 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
    }
    .at-a-glance li::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
    }
    .site-footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 24px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .site-footer p {
      color: var(--text-tertiary);
      font-size: 0.825rem;
    }
    .site-footer a {
      color: var(--text-secondary);
      font-size: 0.825rem;
      text-decoration: none;
    }
    .site-footer a:hover { color: var(--accent); }
    @media (max-width: 600px) {
      article { padding: 24px 16px 48px; }
      .article-header h1 { font-size: 1.75rem; }
      .section { padding: 18px; }
      .site-header-inner { padding: 14px 16px; }
      .site-footer { padding: 20px 16px 32px; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-title"><a href="/">AI Briefing</a></div>
      <nav class="site-nav">
        <a href="latest.html">Latest</a>
        <a href="archive.html">Archive</a>
      </nav>
    </div>
  </header>
  <article>
    <header class="article-header">
      <span class="eyebrow">Daily Briefing</span>
      <h1>June 2nd, 2026</h1>
      <div class="article-meta">
        <time datetime="2026-06-02">June 2nd, 2026</time>
        <span class="reading-time">1 min read</span>
      </div>
    </header>
    <section class="section">
  <h2>Test</h2>
  <p>Test</p>
</section>
  </article>
  <footer class="site-footer">
    <p>AI Briefing &mdash; curated daily by Jarvis for Tim Dawson</p>
    <a href="archive.html">View Archive</a>
  </footer>
</body>
</html>
