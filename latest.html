<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Briefing - 2026-06-02</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d2430;
      --muted: #5d6778;
      --border: #dfe4ea;
      --accent: #2457c5;
      --accent-soft: #e8eefc;
      --shadow: 0 12px 32px rgba(18, 28, 45, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --panel: #191e25;
        --text: #eff3f8;
        --muted: #aab3c2;
        --border: #2d3642;
        --accent: #8fb3ff;
        --accent-soft: #1f2a3f;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.05;
    }
    .subtitle {
      max-width: 720px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .card {
      margin: 16px 0;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      line-height: 1.25;
    }
    p { margin: 0 0 12px; }
    p:last-child { margin-bottom: 0; }
    ul {
      margin: 8px 0 0;
      padding-left: 1.25rem;
    }
    li { margin: 0.45rem 0; }
    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
      overflow-wrap: anywhere;
    }
    strong { font-weight: 700; }
    .meta {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-top: 18px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--muted);
      font-size: 0.92rem;
    }
    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Daily AI Briefing</p>
      <h1>2026-06-02</h1>
      <p class="subtitle">Curated AI developments with the source links kept here, where they belong, rather than sprayed across Discord like confetti.</p>
      <div class="meta">Generated locally by Jarvis</div>
    </header>
    <section class="card">
  <h2>Deploy Test</h2>
  <p>Verifying deployment works.</p>
</section>
    <footer>Source links are embedded in the relevant sections.</footer>
  </main>
</body>
</html>
